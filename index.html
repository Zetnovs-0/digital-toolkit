<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Digital Toolkit 1.1 — Build Your Setup</title>
<style>
  :root {
    --bg: #0a0c10; --bg-soft: #12151c; --card: #171b24; --card-hover: #1e232e;
    --border: #262c38; --text: #e4e8f0; --muted: #7d8598;
    --accent: #5c7cfa; --accent-2: #9775fa;
    --shadow: 0 8px 24px rgba(0,0,0,.45); --radius: 14px;
    --c1: #5c7cfa; --c2: #9775fa;
  }
  html[data-theme="light"] {
    --bg: #f2f4f8; --bg-soft: #ffffff; --card: #ffffff; --card-hover: #eef1f7;
    --border: #dde2ec; --text: #1a1f2b; --muted: #5b6478;
    --shadow: 0 6px 20px rgba(20,30,60,.07);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    line-height: 1.5; min-height: 100vh; transition: background .25s, color .25s;
    overflow-x: hidden;
  }
  #dotGrid { position: fixed; inset: 0; z-index: -2; pointer-events: none; width: 100%; height: 100%; }

  header.site-header { max-width: 1180px; margin: 0 auto; padding: 28px 24px 4px; position: relative; z-index: 10; }
  .header-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 {
    font-size: clamp(1.5rem, 3.2vw, 2rem); margin: 0;
    background: linear-gradient(90deg, #5c7cfa, #9775fa, #f06595, #5c7cfa);
    background-size: 300% auto; -webkit-background-clip: text; background-clip: text;
    color: transparent; font-weight: 800; letter-spacing: -0.02em;
    animation: shimmer 10s linear infinite; cursor: pointer;
  }
  @keyframes shimmer { to { background-position: 300% center; } }
  .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .setup-badge {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 0 12px; height: 38px; border-radius: 11px;
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer; font-family: inherit; font-size: .82rem; font-weight: 600;
    transition: all .15s;
  }
  .setup-badge:hover { border-color: var(--accent); background: var(--card-hover); }
  .setup-badge .sb-icon { font-size: 1rem; }
  .setup-badge .sb-swap { color: var(--muted); font-size: .72rem; font-weight: 500; }

  .icon-btn {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    cursor: pointer; transition: background .2s, transform .1s; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--card-hover); }
  .icon-btn:active { transform: scale(.95); }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-sun { display: none; }
  html[data-theme="light"] .icon-sun { display: block; }
  html[data-theme="light"] .icon-moon { display: none; }

  .toolbar { max-width: 1180px; margin: 14px auto 0; padding: 0 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: relative; z-index: 1; }
  .search {
    flex: 1; min-width: 220px; display: flex; align-items: center; gap: 10px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; transition: border-color .2s, box-shadow .2s;
  }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(92,124,250,.15); }
  .search svg { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
  .search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-size: .95rem; font-family: inherit;
  }
  .search input::placeholder { color: var(--muted); }
  .stats { color: var(--muted); font-size: .85rem; white-space: nowrap; }

  main { max-width: 1180px; margin: 0 auto; padding: 20px 24px 80px; position: relative; z-index: 1; }

  /* WELCOME */
  .welcome-wrap { max-width: 720px; margin: 60px auto 0; padding: 0 24px; text-align: center; animation: enterUp .8s cubic-bezier(.2,.7,.3,1.2); }
  @keyframes enterUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .welcome-eyebrow {
    display: inline-block; font-size: .75rem; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); padding: 5px 14px; border-radius: 999px;
    background: rgba(92,124,250,.1); border: 1px solid rgba(92,124,250,.28);
    margin-bottom: 18px;
  }
  .welcome-wrap h2 { font-size: clamp(2rem, 5.5vw, 3.4rem); margin: 0 0 16px; font-weight: 800; letter-spacing: -.035em; line-height: 1.05; }
  .welcome-wrap h2 .grad { background: linear-gradient(120deg, #5c7cfa, #9775fa 55%, #f06595); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .welcome-wrap p { color: var(--muted); font-size: 1.1rem; margin: 0 auto 30px; max-width: 52ch; }
  .welcome-steps { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; margin-bottom: 36px; }
  .welcome-step { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .82rem; color: var(--muted); min-width: 90px; }
  .welcome-step .n {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--c1), var(--c2));
    display: grid; place-items: center; color: #fff;
    font-weight: 800; font-size: 1rem;
    box-shadow: 0 8px 20px -6px var(--c1);
  }
  .welcome-step .l { font-weight: 600; color: var(--text); font-size: .88rem; }
  .welcome-cta {
    background: linear-gradient(135deg, #5c7cfa, #9775fa); color: #fff;
    padding: 16px 40px; border-radius: 14px; border: none; cursor: pointer;
    font-family: inherit; font-weight: 800; font-size: 1.05rem;
    display: inline-flex; align-items: center; gap: 10px;
    box-shadow: 0 12px 32px -6px #5c7cfa;
    transition: transform .08s ease-out, box-shadow .12s ease-out;
  }
  .welcome-cta:hover { transform: translateY(-1px) scale(.99); box-shadow: 0 14px 30px -6px #5c7cfa; }
  .welcome-cta:active { transform: scale(.96); transition-duration: .05s; }
  .welcome-cta svg { width: 18px; height: 18px; }
  .welcome-hint { color: var(--muted); font-size: .82rem; margin-top: 18px; }

  /* QUIZ */
  .quiz-wrap { max-width: 720px; margin: 30px auto 0; padding: 0 24px; animation: enterUp .55s cubic-bezier(.2,.7,.3,1.2); }
  .quiz-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .quiz-progress .bar-track { flex: 1; height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .quiz-progress .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--c1), var(--c2)); transition: width .4s cubic-bezier(.2,.7,.3,1); }
  .quiz-progress .txt { font-size: .78rem; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }

  .quiz-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 22px; padding: 32px 30px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .quiz-card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(90% 60% at 50% -20%, var(--c1), transparent 60%);
    opacity: .12;
  }
  .quiz-eyebrow {
    font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
    font-weight: 800; color: var(--c1); position: relative; z-index: 1;
    margin-bottom: 10px;
  }
  .quiz-q { font-size: clamp(1.3rem, 3.2vw, 1.75rem); font-weight: 800; margin: 0 0 6px; position: relative; z-index: 1; letter-spacing: -.02em; line-height: 1.2; }
  .quiz-sub { color: var(--muted); margin: 0 0 24px; position: relative; z-index: 1; font-size: .95rem; }
  .quiz-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; position: relative; z-index: 1; }
  .quiz-opt {
    background: var(--bg-soft); border: 1px solid var(--border);
    color: var(--text); padding: 18px 16px; border-radius: 14px;
    cursor: pointer; font-family: inherit; font-size: .95rem; font-weight: 600;
    display: flex; align-items: flex-start; gap: 12px;
    transition: border-color .1s ease-out, background .1s ease-out, box-shadow .1s ease-out;
    text-align: left;
  }
  .quiz-opt .b-emoji { font-size: 1.5rem; flex-shrink: 0; line-height: 1; }
  .quiz-opt .b-text { display: flex; flex-direction: column; gap: 2px; }
  .quiz-opt .b-label { font-weight: 700; font-size: .95rem; }
  .quiz-opt .b-hint { font-weight: 400; color: var(--muted); font-size: .78rem; line-height: 1.4; }
  .quiz-opt:hover { border-color: var(--c1); background: var(--card-hover); box-shadow: 0 6px 14px rgba(0,0,0,.2); }
  .quiz-opt:active { transform: scale(.97); transition-duration: .05s; }
  .quiz-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; position: relative; z-index: 1; }

  /* QUICK PICK */
  .quick-pick {
    margin-top: 22px; padding: 20px 18px;
    background: var(--bg-soft); border: 1px dashed var(--border);
    border-radius: 16px; position: relative; z-index: 1;
  }
  .quick-pick-label { font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; text-align: center; }
  .quick-pick-group { margin-bottom: 16px; }
  .quick-pick-group:last-of-type { margin-bottom: 0; }
  .quick-pick-group-label {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: .68rem; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
    margin-bottom: 9px;
  }
  .quick-pick-group-label::before,
  .quick-pick-group-label::after {
    content: ""; height: 1px; width: 22px;
    background: var(--border);
  }
  .quick-pick-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .quick-chip {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 9px 15px; border-radius: 11px; cursor: pointer;
    font-family: inherit; font-size: .88rem; font-weight: 600;
    display: inline-flex; align-items: center; gap: 7px;
    transition: border-color .1s ease-out, background .1s ease-out, box-shadow .1s ease-out;
    position: relative;
  }
  .quick-chip:hover { border-color: var(--c1); background: var(--card-hover); box-shadow: 0 4px 10px rgba(0,0,0,.18); }
  .quick-chip:active { transform: scale(.95); transition-duration: .05s; }
  .quick-chip .qc-emoji { font-size: 1.05rem; line-height: 1; }
  .quick-chip.selected {
    border-color: var(--c1);
    background: linear-gradient(135deg, rgba(92,124,250,.15), rgba(151,117,250,.15));
    box-shadow: 0 0 0 2px var(--c1) inset;
  }
  .quick-chip.selected::after {
    content: "✓"; position: absolute; top: -7px; right: -7px;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--c1); color: #fff;
    display: grid; place-items: center;
    font-size: .7rem; font-weight: 900;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .quick-pick-actions {
    display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap;
  }
  /* Proceed button on top, quiz button directly below it (both centered). */
  .quick-pick-actions.stack { flex-direction: column; align-items: center; }

  /* OS CHOICE — Windows in center, macOS left, Linux right */
  .os-choice-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
  .os-choice-grid .os-opt-win { grid-column: 2; grid-row: 1; }
  .os-choice-grid .os-opt-mac  { grid-column: 1; grid-row: 1; justify-self: end; }
  .os-choice-grid .os-opt-linux{ grid-column: 3; grid-row: 1; justify-self: start; }
  .os-opt {
    background: var(--bg-soft); border: 1px solid var(--border); color: var(--text);
    padding: 20px 18px; border-radius: 16px; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 170px; text-align: center; transition: border-color .1s ease-out, background .1s ease-out, box-shadow .1s ease-out; position: relative;
  }
  .os-opt:hover { border-color: var(--c1); background: var(--card-hover); box-shadow: 0 6px 14px rgba(0,0,0,.2); }
  .os-opt:active { transform: scale(.96); transition-duration: .05s; }
  .os-opt.selected {
    border-color: var(--c1);
    background: linear-gradient(135deg, rgba(92,124,250,.15), rgba(151,117,250,.15));
    box-shadow: 0 0 0 2px var(--c1) inset;
  }
  .os-opt.selected::after {
    content: "✓"; position: absolute; top: -8px; right: -8px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--c1); color: #fff;
    display: grid; place-items: center; font-size: .72rem; font-weight: 900;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .os-opt .logo { width: 46px; height: 46px; border-radius: 12px; background: #fff; display: grid; place-items: center; overflow: hidden; padding: 7px; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .os-opt .logo img { width: 100%; height: 100%; object-fit: contain; }
  .os-opt .logo .letter { font-size: 1.4rem; font-weight: 800; color: #1a1f2b; }
  .os-opt .o-label { font-weight: 800; font-size: 1rem; }
  .os-opt .o-hint { color: var(--muted); font-size: .75rem; line-height: 1.35; }
  @media (max-width: 640px) {
    .os-choice-grid { grid-template-columns: 1fr; }
    .os-choice-grid .os-opt-win, .os-choice-grid .os-opt-mac, .os-choice-grid .os-opt-linux { grid-column: 1; grid-row: auto; justify-self: stretch; }
    .os-choice-grid .os-opt-win { order: -1; }
    .os-opt { width: auto; }
  }

  /* BROWSER SELECTION — firefox left, others center, chromium right */
  .browser-cols { display: grid; grid-template-columns: 1fr 1.05fr 1fr; gap: 12px; align-items: start; }
  .browser-col { min-width: 0; }
  .browser-col-label {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    font-size: .7rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
  }
  .browser-col-label::before, .browser-col-label::after { content: ""; height: 1px; width: 16px; background: var(--border); }
  .browser-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .browser-center-inner { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  @media (max-width: 760px) { .browser-cols { grid-template-columns: 1fr; } }

  /* Graphical browser tiles — big logos for popular browsers, small for niche ones */
  .browser-tiles { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; padding: 4px 0; }
  .b-tile {
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    cursor: pointer; font-family: inherit; color: var(--text);
    transition: border-color .1s ease-out, background .1s ease-out, transform .08s ease-out, box-shadow .1s ease-out;
  }
  .b-tile:hover { border-color: var(--c1, var(--accent)); background: var(--card-hover); box-shadow: 0 5px 14px rgba(0,0,0,.22); }
  .b-tile:active { transform: scale(.95); transition-duration: .05s; }
  .b-tile.selected { border-color: var(--c1); background: var(--card-hover); box-shadow: 0 0 0 2px var(--c1) inset, 0 6px 16px rgba(0,0,0,.25); }
  .b-tile .logo { display: grid; place-items: center; overflow: hidden; background: #fff; border-radius: 24%; }
  .b-tile .logo img { width: 100%; height: 100%; object-fit: contain; }
  .b-tile .b-name { font-weight: 700; line-height: 1.15; text-align: center; }
  .b-tile.big { width: 138px; padding: 18px 12px 14px; }
  .b-tile.big .logo { width: 72px; height: 72px; }
  .b-tile.big .b-name { font-size: .9rem; }
  .b-tile.small { width: 104px; padding: 12px 8px 10px; border-radius: 14px; }
  .b-tile.small .logo { width: 46px; height: 46px; }
  .b-tile.small .b-name { font-size: .76rem; color: var(--muted); }
  .b-tile.selected .b-name { color: var(--text); }
  .b-tile.off { opacity: .45; border-style: dashed; cursor: not-allowed; }
  .b-tile.off:hover { box-shadow: none; border-color: var(--border); background: var(--card); }
  .b-tile.off:active { transform: none; }
  .b-tile .os-ind { margin-top: -2px; }
  .tiles-off-label { width: 100%; text-align: center; font-size: .68rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }

  /* Chosen OS badge — centered at the top of the selection screen */
  .chosen-os { display: flex; justify-content: center; margin-bottom: 18px; animation: enterUp .4s cubic-bezier(.2,.7,.3,1.2); }

  /* Tool cards unavailable on your setup (listed under the badge) */
  .card.unavailable { opacity: .6; border-style: dashed; }
  .card.unavailable:hover { opacity: .85; }
  .os-ind {
    display: inline-flex; align-items: center; gap: 3px; font-size: .68rem; font-weight: 700;
    padding: 2px 8px; border-radius: 999px;
    background: rgba(148,163,184,.12); color: var(--muted); border: 1px solid var(--border);
  }

  .btn-secondary {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 11px 20px; border-radius: 11px; cursor: pointer;
    font-family: inherit; font-size: .88rem; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    transition: border-color .1s ease-out, color .1s ease-out, background .1s ease-out;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--text); background: var(--card); }
  .btn-secondary:active { transform: scale(.96); transition-duration: .05s; }
  .btn-secondary:disabled { opacity: .45; cursor: not-allowed; }

  /* RESULT */
  .result-wrap { max-width: 720px; margin: 30px auto 0; padding: 0 24px; animation: enterUp .55s cubic-bezier(.2,.7,.3,1.2); }
  .result-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 22px; padding: 34px 30px; box-shadow: var(--shadow);
    position: relative; overflow: hidden;
  }
  .result-card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, var(--c1), var(--c2)); opacity: .14;
  }
  .result-card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(600px 300px at 110% -20%, var(--c2), transparent 60%);
    opacity: .28;
  }
  .result-eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; color: var(--c1); position: relative; z-index: 1; margin-bottom: 12px; }
  .result-head { display: flex; gap: 18px; align-items: center; margin-bottom: 16px; position: relative; z-index: 1; }
  .result-logo {
    width: 72px; height: 72px; border-radius: 18px;
    background: #fff; display: grid; place-items: center; padding: 10px;
    flex-shrink: 0; overflow: hidden;
    box-shadow: 0 8px 22px rgba(0,0,0,.25);
  }
  .result-logo img { width: 100%; height: 100%; object-fit: contain; }
  .result-logo .letter { font-size: 1.8rem; font-weight: 800; color: #1a1f2b; }
  .result-title { font-size: 1.6rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -.02em; position: relative; z-index: 1; }
  .result-desc { color: var(--muted); margin: 0; font-size: .95rem; position: relative; z-index: 1; max-width: 55ch; }
  .result-why {
    background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; margin-top: 18px;
    position: relative; z-index: 1;
  }
  .result-why h4 { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
  .result-why ul { margin: 0; padding: 0; list-style: none; }
  .result-why li { font-size: .88rem; padding: 3px 0 3px 16px; position: relative; color: var(--text); }
  .result-why li::before { content: "✓"; position: absolute; left: 0; color: var(--c1); font-weight: 800; }
  .result-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; position: relative; z-index: 1; }
  .btn-primary {
    background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff;
    padding: 13px 26px; border-radius: 12px; border: none; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: .95rem;
    display: inline-flex; align-items: center; gap: 8px;
    box-shadow: 0 10px 26px -6px var(--c1);
    transition: transform .08s ease-out, box-shadow .12s ease-out;
  }
  .btn-primary:hover { transform: translateY(-1px) scale(.99); box-shadow: 0 10px 22px -6px var(--c1); }
  .btn-primary:active { transform: scale(.96); transition-duration: .05s; }
  .btn-primary svg { width: 16px; height: 16px; }

  /* GRID */
  .group-label {
    font-size: .76rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: .12em; color: var(--muted);
    margin: 30px 0 12px; display: flex; align-items: center; gap: 10px;
  }
  .group-label::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .group-label:first-child { margin-top: 8px; }

  .scenario-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .scenario-card {
    position: relative; overflow: hidden;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 20px 20px 18px;

<script>
/* ============================================================
   LOGO SYSTEM
   ------------------------------------------------------------
   Cascading logo resolution:
     0. YOUR OWN logos  (files in /logos, mapped in logos/manifest.js)
     1. Curated high-quality source (Simple Icons / official SVG)
     2. Logo.dev  (best general source, uses your API token)
     3. Unavatar  (aggregator fallback)
     4. Google favicon @256 (last-ditch)
     5. Styled letter avatar (never breaks)
   To serve a logo yourself: drop a file into logos/ and map it in
   logos/manifest.js (see logos/README.md). Bump "version" there
   when you replace a file so browsers refetch it.
   ============================================================ */
const LOGO_DEV_TOKEN = "sk_CpdmWoi_SJKq3M-pc_5qvA";

/* ---- Local logos (served from your /logos folder) ----
   The mapping lives in logos/manifest.js — a plain <script> include,
   so it loads even when index.html is opened directly from disk. */
const LOCAL_LOGOS = window.LOCAL_LOGOS_MANIFEST?.logos || {};
const LOCAL_LOGOS_VERSION = window.LOCAL_LOGOS_MANIFEST?.version || "";

function localLogoFor(name) {
  const file = LOCAL_LOGOS[name];
  if (!file) return null;
  const v = LOCAL_LOGOS_VERSION ? `?v=${encodeURIComponent(LOCAL_LOGOS_VERSION)}` : "";
  return `logos/${file}${v}`;
}

/* Optional per-item overrides for tools whose URL domain isn't
   the brand's real domain (or where we want a specific source). */
const LOGO_OVERRIDES = {
  "PowerToys":    { domain: "microsoft.com" },
  "ShareX":       { domain: "getsharex.com" },
  "balenaEtcher": { domain: "balena.io" },
  "7-Zip":        { domain: "7-zip.org" },
  "XMCL":         { domain: "xmcl.app" },
  "Cobalt":       { domain: "cobalt.tools" },
  "Hiddify":      { domain: "hiddify.com" },
  "Radio Garden": { domain: "radio.garden" },
  "Windy":        { domain: "windy.com" },
  "TutaMail":     { domain: "tuta.com" },
  "Organic Maps": { domain: "organicmaps.app" },
  "Reverso":      { domain: "reverso.net" },
  "Clonezilla":   { domain: "clonezilla.org" },
  "Flameshot":    { domain: "flameshot.org" },
  "DaVinci Resolve": { domain: "blackmagicdesign.com" },
  "Audacity":     { domain: "audacityteam.org" },
  "Falkon":       { domain: "falkon.org" },
  "qutebrowser":  { domain: "qutebrowser.org" },
  "Ladybird":     { domain: "ladybird.org" },
  "Mullvad Browser": { domain: "mullvad.net" },
  "Safari":       { domain: "apple.com" }
};

function extractDomain(url) {
  try {
    const u = new URL(url);
    return u.hostname.replace(/^www\./, "");
  } catch (e) { return ""; }
}

/* Build the ordered list of candidate logo URLs for an item. */
function logoSources(item) {
  const sources = [];

  // 0. Your own logo, mapped in logos/manifest.js — served from you.
  const local = localLogoFor(item.name);
  if (local) sources.push(local);

  // Determine the domain to query logo services with.
  const override = LOGO_OVERRIDES[item.name];
  const domain = (override && override.domain) || extractDomain(item.url);

  // 1. Curated high-quality logo (Simple Icons CDN, official SVG, etc.).
  //    Skip Google favicon URLs — those are handled later as a fallback.
  if (item.logo && !/google\.com\/s2\/favicons/.test(item.logo)) {
    sources.push(item.logo);
  }

  // 2. Logo.dev — high quality, brand-accurate, cached globally.
  if (domain) {
    const url =
      `https://img.logo.dev/${domain}` +
      `?token=${LOGO_DEV_TOKEN}` +
      `&size=128&format=png&retina=true&fallback=404`;
    sources.push(url);
  }

  // 3. Unavatar — aggregates multiple upstream providers.
  if (domain) {
    sources.push(`https://unavatar.io/${domain}`);
  }

  // 4. Google favicon at 256px — reliable but lower quality.
  if (domain) {
    sources.push(`https://www.google.com/s2/favicons?domain=${domain}&sz=256`);
  }

  // 5. Whatever was in item.logo originally (might be a Google URL).
  if (item.logo && !sources.includes(item.logo)) {
    sources.push(item.logo);
  }

  // Deduplicate while preserving order.
  return sources.filter((v, i, a) => v && a.indexOf(v) === i);

/* Render an <img> with the full fallback chain embedded in a data attribute. */
function logoHTML(item) {
  const letter = escapeHTML((item.name[0] || "?").toUpperCase());
  const sources = logoSources(item);
  if (!sources.length) return `<span class="letter">${letter}</span>`;
  const remaining = sources.slice(1);
  return `<img src="${escapeHTML(sources[0])}" data-srcs='${escapeHTML(JSON.stringify(remaining))}' data-letter="${letter}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="window.logoFallback(this)">`;

/* Called by <img onerror>. Advances to the next source, or falls back to a letter. */
window.logoFallback = function (img) {
  let queue = [];
  try { queue = JSON.parse(img.dataset.srcs || "[]"); } catch (e) {}
  if (queue.length) {
    const next = queue.shift();
    img.dataset.srcs = JSON.stringify(queue);
    img.src = next;
    return;
  }
  const letter = img.dataset.letter || "?";
  img.outerHTML = `<span class="letter">${letter}</span>`;
};

   STATE
   ============================================================ */
function loadArray(key) {
  try { return JSON.parse(localStorage.getItem(key) || "[]"); }
  catch(e) { return []; }
}
const state = {
  osList: loadArray("osList"),
  browserList: loadArray("browserList"),
  view: "os-choice",
  scenarioId: null,
  itemName: null,
  query: "",
  theme: localStorage.getItem("theme") || "dark",
  osAnswers: {},
  browserAnswers: {},
  pendingOsSelection: new Set(),
  pendingBrowserSelection: new Set()
};
(function migrate() {
  const oldOs = localStorage.getItem("os");
  const oldDistro = localStorage.getItem("distro");
  const oldBrowser = localStorage.getItem("browser");
  if (oldOs && state.osList.length === 0) {
    if (oldOs === "linux") state.osList = ["linux"];
    else state.osList = [oldOs];
  }
  if (oldBrowser && state.browserList.length === 0) {
    state.browserList = [oldBrowser];
  }
  /* Distros are gone — collapse any legacy distro ids into plain Linux. */
  state.osList = normalizeOsList(state.osList);
  localStorage.setItem("osList", JSON.stringify(state.osList));
  localStorage.removeItem("os");
  localStorage.removeItem("distro");
  localStorage.removeItem("browser");
})();

document.documentElement.setAttribute("data-theme", state.theme);
let lastNonSearchRoute = "#/home";

function osLabelFor(id) {
  if (!id) return "—";
  const c = OS_CANDIDATES[id];
  return c ? c.label : id;
}
function osEmojiFor(id) {
  const c = OS_CANDIDATES[id];
  return c ? c.emoji : "💻";
}
function osLabelList() {
  if (!state.osList.length) return "—";
  if (state.osList.length === 1) return osLabelFor(state.osList[0]);
  return `${osLabelFor(state.osList[0])} + ${state.osList.length - 1} more`;
}
function osEmojiList() {
  if (!state.osList.length) return "💻";
  return state.osList.map(osEmojiFor).slice(0, 3).join("");
}
function browserLabelList() {
  if (!state.browserList.length) return "—";
  const nameOf = (id) => BROWSERS[id] ? BROWSERS[id].name : id;
  if (state.browserList.length === 1) return nameOf(state.browserList[0]);
  return `${nameOf(state.browserList[0])} + ${state.browserList.length - 1} more`;
}
function browserEmojiList() {
  if (!state.browserList.length) return "🌐";
  return state.browserList.map(id => BROWSERS[id] ? BROWSERS[id].emoji : "🌐").slice(0, 3).join("");
}
function osTagFor(id) {
  const c = OS_CANDIDATES[id];
  if (c && c.cls) return c.cls;
  if (id === "win") return "win";
  if (id === "mac") return "mac";
  return "linux";
}
/* Legacy distro ids stored in older localStorage entries map to plain Linux. */
function normalizeOsList(list) {
  const out = [];
  for (const id of list) {
    const norm = OS_CANDIDATES[id] ? id : "linux";
    if (!out.includes(norm)) out.push(norm);
  }
  return out;
}
function isUsingBothBrowsers() {
  return state.browserList.includes("zen") && state.browserList.includes("helium");
}
function isScenarioHidden(id) {
  if (id === "browsers" && isUsingBothBrowsers()) return true;
  return false;
}
function browserAvailableForOS(browserId) {
  const b = BROWSERS[browserId];
  if (!b || !b.os) return true;
  return state.osList.some((selId) => b.os.includes(osTagFor(selId)));
}

/* ============================================================
   ROUTING
   ============================================================ */
function parseHash() {
  const h = (location.hash || "#/").slice(1);
  const parts = h.split("/").filter(Boolean);
  if (!parts.length) return { view: "os-choice" };
  const [a, b, c] = parts;
  switch (a) {
    case "welcome":        return { view: "os-choice" };
    case "os-choice":      return { view: "os-choice" };
    case "os-quiz":        return { view: "os-quiz" };
    case "os-result":      return { view: "os-result" };
    case "browser-choice": return { view: "browser-choice" };
    case "browser-quiz":   return { view: "browser-quiz" };
    case "browser-result": return { view: "browser-result" };
    case "home":           return { view: "scenarios" };
    case "all":            return { view: "all" };
    case "scenario":       return { view: "scenario", scenarioId: b || null };
    case "item":           return { view: "item", scenarioId: b || null, itemName: c ? decodeURIComponent(c) : null };
    case "search":         return { view: "search", query: b ? decodeURIComponent(b) : "" };
    default:               return { view: "os-choice" };
  }
}
function go(hash) {
  if ((location.hash || "#/") === hash) { handleRoute(); return; }
  location.hash = hash;
}
function handleRoute() {
  const route = parseHash();

  if (["scenarios","all","scenario","item","search"].includes(route.view)) {
    if (!state.osList.length) { history.replaceState(null, "", "#/os-choice"); return handleRoute(); }
    if (!state.browserList.length) { history.replaceState(null, "", "#/browser-choice"); return handleRoute(); }
  }
  if ((route.view === "browser-choice" || route.view === "browser-quiz") && !state.osList.length) { history.replaceState(null, "", "#/os-choice"); return handleRoute(); }
  if (route.view === "browser-result" && !state.osList.length) { history.replaceState(null, "", "#/os-choice"); return handleRoute(); }
  if (route.view === "os-result") { history.replaceState(null, "", "#/os-quiz"); return handleRoute(); }
  if (route.view === "scenario" && !route.scenarioId) { history.replaceState(null, "", "#/home"); return handleRoute(); }
  if (route.view === "item" && (!route.scenarioId || !route.itemName)) { history.replaceState(null, "", "#/home"); return handleRoute(); }
  if ((route.view === "scenario" || route.view === "item") && isScenarioHidden(route.scenarioId)) {
    history.replaceState(null, "", "#/home"); return handleRoute();
  }

  state.view = route.view;
  state.scenarioId = route.scenarioId || null;
  state.itemName = route.itemName || null;

  if (route.view === "search") {
    state.query = (route.query || "").toLowerCase();
    const inp = document.getElementById("searchInput");
    if (inp) inp.value = route.query || "";
  } else {
    state.query = "";
    const inp = document.getElementById("searchInput");
    if (inp) inp.value = "";
    if (["scenarios","scenario","item","all"].includes(route.view)) {
      lastNonSearchRoute = location.hash || "#/home";
    }
  }
  render();
}
window.addEventListener("popstate", handleRoute);
window.addEventListener("hashchange", handleRoute);

function osAvailable(item) {
  if (!state.osList.length) return true;
  const itemOS = item.os || ["win", "linux", "mac"];
  return state.osList.some((selId) => itemOS.includes(osTagFor(selId)));
}
function visibleItems(scenario) { return scenario.items.filter(osAvailable); }
function unavailableItems(scenario) { return scenario.items.filter((it) => !osAvailable(it)); }
function allItemsOf(scenario) {
  const av = visibleItems(scenario), un = unavailableItems(scenario);
  return [...av, ...un];
}
function visibleChildren(item) { return (item.children || []).filter(osAvailable); }
/* OS requirement indicators shown on cards that don't run on your setup. */
function osIndicatorsHTML(item) {
  let list = item.osInd;
  if (!list) {
    const map = { win: { e: "🪟", t: "Windows" }, mac: { e: "🍎", t: "macOS" }, linux: { e: "🐧", t: "Linux" } };
    list = (item.os || ["win", "linux", "mac"]).map((k) => map[k]).filter(Boolean);
  }
  return `<span class="os-ind">Needs: ${list.map((i) => `${i.e} ${escapeHTML(i.t)}`).join(" · ")}</span>`;
}

function activeScenarios() { return SCENARIOS.filter((sc) => !isScenarioHidden(sc.id)); }
function visibleScenarios() {
  return activeScenarios()
    .map((sc) => ({ ...sc, items: visibleItems(sc) }))
    .filter((sc) => sc.items.length > 0);
}

const OS_BUCKETS = {
  win:   { id: "win",   label: "Windows",        emoji: "🪟" },
  linux: { id: "linux", label: "Linux",          emoji: "🐧" },
  mac:   { id: "mac",   label: "macOS",          emoji: "🍎" },
  cross: { id: "cross", label: "Cross-platform", emoji: "🌐" }
};
const BUCKET_ORDER = ["win", "linux", "mac", "cross"];

function bucketForItem(item) {
  const set = item.os || ["win", "linux", "mac"];
  if (set.length >= 2) return "cross";
  if (set.includes("win")) return "win";
  if (set.includes("linux")) return "linux";
  if (set.includes("mac")) return "mac";
  return "cross";
}

/* ============================================================
   CARD
   ============================================================ */
function renderCard(item, scenario, opts) {
  opts = opts || {};
  const children = visibleChildren(item);
  const hasChildren = children.length > 0;
  const tag = hasChildren ? "button" : "a";
  const styleAttr = scenario ? ` style="--c1:${scenario.color[0]};--c2:${scenario.color[1]}"` : "";
  const attrs = hasChildren
    ? `type="button" data-item="${escapeHTML(item.name)}"${styleAttr}`
    : `href="${escapeHTML(item.url)}" target="_blank" rel="noopener"${styleAttr}`;
  const avail = osAvailable(item);
  const pills = [];
  if (!avail) pills.push(osIndicatorsHTML(item));
  if (opts.subTitles && opts.subTitles.length) {
    opts.subTitles.forEach((t) => pills.push(`<span class="tag tag-sub">${escapeHTML(t)}</span>`));
  }
  if (item.tag) pills.push(`<span class="tag">${escapeHTML(item.tag)}</span>`);
  (item.badges || []).forEach((b) => {
    pills.push(`<span class="badge badge-${b.color || "blue"}">${escapeHTML(b.text)}</span>`);
  });
  if (hasChildren) pills.push(`<span class="tag">${children.length} add-on${children.length === 1 ? "" : "s"} →</span>`);
  return `
    <${tag} class="card${avail ? "" : " unavailable"}" ${attrs}>
      <div class="logo">${logoHTML(item)}</div>
      <div class="body">
        <div class="name"><span>${escapeHTML(item.name)}</span><span class="ext">${hasChildren ? "→" : "↗"}</span></div>
        <p class="desc">${escapeHTML(item.desc)}</p>
        ${pills.length ? `<div class="pill-row">${pills.join("")}</div>` : ""}
      </div>
    </${tag}>
  `;
}

function renderColumnBody(items, scenario) {
  const multiSub = scenario.subscenarios.length > 1;
  // Keep the "available first, other-OS below" order coming from the caller.
  const pool = items.filter((it) => allItemsOf(scenario).some((g) => g.name === it.name));
  if (!multiSub) {
    return pool.map((it) => renderCard(it, scenario)).join("");
  }
  const blocks = [];
  scenario.subscenarios.forEach((sub) => {
    const subItems = pool.filter((it) => it.subscenarios.includes(sub.id));
    if (!subItems.length) return;
    blocks.push(`
      <div class="sub-label"><span>${sub.emoji}</span><span>${escapeHTML(sub.title)}</span></div>
      ${subItems.map((it) => renderCard(it, scenario, { subTitles: [] })).join("")}
    `);
  });
  const noSub = pool.filter((it) => !(it.subscenarios || []).length);
  if (noSub.length) blocks.push(noSub.map((it) => renderCard(it, scenario)).join(""));
  return blocks.join("");
}

function computeOsResult() {
  const totals = {};
  Object.keys(OS_CANDIDATES).forEach((k) => totals[k] = 0);
  OS_QUIZ.forEach((q) => {
    const ans = state.osAnswers[q.id];
    if (!ans) return;
    const opt = q.options.find((o) => o.id === ans);
    if (!opt) return;
    Object.entries(opt.scores).forEach(([k, v]) => { totals[k] = (totals[k] || 0) + v; });
  });
  const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  return { topId: sorted[0][0], sorted };
}

  const eligible = eligibleQuizBrowserIds();
  const totals = {};
  eligible.forEach((k) => { if (BROWSERS[k]) totals[k] = 0; });
  BROWSER_QUIZ.forEach((q) => {
    const ans = state.browserAnswers[q.id];
    if (!ans) return;
    const opt = q.options.find((o) => o.id === ans);
    if (!opt) return;
    Object.entries(opt.scores).forEach(([k, v]) => {
      if (k in totals) totals[k] += v;
    });
  });
  const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  return { topId: sorted[0][0], sorted };
}

function renderScenarioView() {
  const original = findByScenario(state.scenarioId);
  if (!original) { go("#/home"); return ""; }
  if (isScenarioHidden(original.id)) { go("#/home"); return ""; }
  const scenario = { ...original, items: allItemsOf(original) };
  if (!scenario.items.length) { go("#/home"); return ""; }

  applyScenarioColor(scenario);
  document.getElementById("toolbar").style.display = "";
  updateBadges();

  const buckets = { win: [], linux: [], mac: [], cross: [] };
  // Available-for-your-system tools go in the platform columns; tools that
  // don't run on your setup are NOT placed left/right — they are collected
  // and rendered as a separate section BELOW every other tool.
  scenario.items.filter(osAvailable).forEach((it) => buckets[bucketForItem(it)].push(it));
  const offSetup = scenario.items.filter((it) => !osAvailable(it));
  const usedBuckets = BUCKET_ORDER.filter((k) => buckets[k].length > 0);

  const columns = usedBuckets.map((key) => {
    const meta = OS_BUCKETS[key];
    const items = buckets[key];
    return `
      <div class="column">
        <div class="column-header">
          <span class="label"><span>${meta.emoji}</span><span>${escapeHTML(meta.label)}</span></span>
          <span class="count">${items.length}</span>
        </div>
        ${renderColumnBody(items, scenario)}
      </div>
    `;
  }).join("");

  const offSetupSection = offSetup.length ? `
    <div class="section-title" style="--c1:#868e96;--c2:#adb5bd"><span>🌍</span><span>Not available for your system (${offSetup.length}) — needs another OS</span><span class="line"></span></div>
    <div class="columns" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">
      ${renderColumnBody(offSetup, scenario)}
    </div>
  ` : "";

  document.getElementById("stats").textContent = `${scenario.items.length} tool${scenario.items.length === 1 ? "" : "s"} · ${osLabelList()}`;

  const splitNote = usedBuckets.length > 1
    ? `Split across ${usedBuckets.length} platform groups.`
    : `All ${scenario.items.length} work on your setup.`;

  return `
    <div class="breadcrumb">
      <button class="back-btn" data-action="home">← All categories</button>
      <span class="current">Category: <strong>${escapeHTML(scenario.title)}</strong></span>
    </div>
    <div class="scenario-banner">
      <h2><span class="ic">${getIcon(scenario.id)}</span>${escapeHTML(scenario.title)}</h2>
      <p>${escapeHTML(scenario.desc)} — ${splitNote}</p>
    </div>
    <div class="columns">${columns}</div>
    ${offSetupSection}
  `;
}

function renderSearchView() {
  resetColors();
  updateBadges();
  const q = state.query;
  const results = [];
  for (const sc of activeScenarios()) {
    for (const item of visibleItems(sc)) {
      const hay = (item.name + " " + item.desc + " " + sc.title).toLowerCase();
      if (hay.includes(q)) results.push({ kind: "tool", item, scenario: sc });
      visibleChildren(item).forEach((child) => {
        const childHay = (child.name + " " + child.desc + " " + sc.title).toLowerCase();
        if (childHay.includes(q)) results.push({ kind: "child", item: child, scenario: sc, parent: item });
      });
    }
  }
  document.getElementById("stats").textContent = `${results.length} match${results.length === 1 ? "" : "es"} · ${osLabelList()}`;

  if (!results.length) {
    return `<div class="breadcrumb"><button class="back-btn" data-action="home">← All categories</button><span class="current">Search: <strong>${escapeHTML(state.query)}</strong></span></div>
    <div class="empty"><div class="big">🔍</div><p>Nothing matches "${escapeHTML(state.query)}" for ${osLabelList()}.</p></div>`;
  }

  return `
    <div class="breadcrumb"><button class="back-btn" data-action="home">← All categories</button><span class="current">Search: <strong>${escapeHTML(state.query)}</strong></span></div>
    <div class="scenario-banner" style="--c1:#5c7cfa;--c2:#9775fa">
      <h2><span class="ic">${ICONS.ai}</span>Results</h2>
      <p>${results.length} match${results.length === 1 ? "" : "es"}.</p>
    </div>
    <div class="columns" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">
      ${results.map((r) => {
        if (r.kind === "tool") return renderCard(r.item, r.scenario);
        return `
          <a class="card" href="${escapeHTML(r.item.url)}" target="_blank" rel="noopener" style="--c1:${r.scenario.color[0]};--c2:${r.scenario.color[1]}">

}

function render() {
  const content = document.getElementById("content");

  if (state.view === "os-choice") content.innerHTML = renderOsChoiceView();
  else if (state.view === "os-quiz") content.innerHTML = renderOsQuizView();
  else if (state.view === "os-result") content.innerHTML = renderOsResultView();
  else if (state.view === "browser-choice") content.innerHTML = renderBrowserChoiceView();
  else if (state.view === "browser-quiz") content.innerHTML = renderBrowserQuizView();
  else if (state.view === "browser-result") content.innerHTML = renderBrowserResultView();
  else if (state.view === "search") content.innerHTML = renderSearchView();
  else if (state.view === "all") content.innerHTML = renderAllView();
  else if (state.view === "item") content.innerHTML = renderItemView();
  else if (state.view === "scenario") content.innerHTML = renderScenarioView();
  else content.innerHTML = renderScenariosView();

  bindClicks();
  bindTilt();
}

function bindClicks() {
  const content = document.getElementById("content");

  content.querySelectorAll('[data-action="start-quiz"]').forEach((el) => {
    el.addEventListener("click", () => {
      state.osAnswers = {};
      state.pendingOsSelection = new Set(state.osList);
      go("#/os-quiz");
    });
  });
  content.querySelectorAll('[data-action="start-browser-quiz"]').forEach((el) => {
    el.addEventListener("click", () => {
      state.browserAnswers = {};
      state.pendingBrowserSelection = new Set();
      go("#/browser-quiz");
    });
  });
  content.querySelectorAll('[data-action="welcome"]').forEach((el) => {
    el.addEventListener("click", () => go("#/os-choice"));
  });
  content.querySelectorAll('[data-action="back-os-choice"]').forEach((el) => {
    el.addEventListener("click", () => go("#/os-choice"));
  });

  content.querySelectorAll(".quiz-opt").forEach((el) => {
    el.addEventListener("click", () => {
      const quiz = el.dataset.quiz;
      const qid = el.dataset.qid;
      const oid = el.dataset.oid;
      if (quiz === "os") state.osAnswers[qid] = oid;
      else state.browserAnswers[qid] = oid;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  /* Quick-pick chips update in place — no re-render, so the card never
     replays its entrance animation and the page never shifts or scrolls. */
  function updateQuickPickButton(sel, action, noun1, nounN) {
    const btn = content.querySelector(`[data-action="${action}"]`);
    if (!btn) return;
    const n = sel.size;
    for (const node of btn.childNodes) {
      if (node.nodeType === Node.TEXT_NODE) {
        node.textContent = ` Continue with ${n} ${n === 1 ? noun1 : nounN} `;
        break;
      }
    }
    btn.disabled = n === 0;
  }

  content.querySelectorAll('[data-quick-os]').forEach((el) => {
    el.addEventListener("click", () => {
      const id = el.dataset.quickOs;
      if (state.pendingOsSelection.has(id)) state.pendingOsSelection.delete(id);
      else state.pendingOsSelection.add(id);
      el.classList.toggle("selected", state.pendingOsSelection.has(id));
      updateQuickPickButton(state.pendingOsSelection, "confirm-quick-os", "OS", "OSes");
    });
  });

  content.querySelectorAll('[data-quick-browser]').forEach((el) => {
    el.addEventListener("click", () => {
      const id = el.dataset.quickBrowser;
      if (state.pendingBrowserSelection.has(id)) state.pendingBrowserSelection.delete(id);
      else state.pendingBrowserSelection.add(id);
      el.classList.toggle("selected", state.pendingBrowserSelection.has(id));
      updateQuickPickButton(state.pendingBrowserSelection, "confirm-quick-browser", "browser", "browsers");
    });
  });

  content.querySelectorAll('[data-action="confirm-quick-os"]').forEach((el) => {
    el.addEventListener("click", () => {
      if (!state.pendingOsSelection.size) return;
      state.osList = Array.from(state.pendingOsSelection);
      localStorage.setItem("osList", JSON.stringify(state.osList));
      state.pendingBrowserSelection = new Set(
        Array.from(state.pendingBrowserSelection).filter(browserAvailableForOS)
      );
      state.browserAnswers = {};
      go("#/browser-choice");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  content.querySelectorAll('[data-action="confirm-quick-browser"]').forEach((el) => {
    el.addEventListener("click", () => {
      if (!state.pendingBrowserSelection.size) return;
      state.browserList = Array.from(state.pendingBrowserSelection);
      localStorage.setItem("browserList", JSON.stringify(state.browserList));
      history.replaceState(null, "", "#/home");
      handleRoute();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  content.querySelectorAll('[data-action="os-back"]').forEach((el) => {
    el.addEventListener("click", () => {
      const keys = Object.keys(state.osAnswers);
      if (keys.length) { delete state.osAnswers[keys[keys.length - 1]]; }
      render();
    });
  });

  content.querySelectorAll('[data-action="browser-back"]').forEach((el) => {
    el.addEventListener("click", () => {
      const keys = Object.keys(state.browserAnswers);
      if (keys.length) { delete state.browserAnswers[keys[keys.length - 1]]; }
      else { go("#/browser-choice"); return; }
      render();
    });
  });

  content.querySelectorAll('[data-action="os-restart"]').forEach((el) => {
    el.addEventListener("click", () => { state.osAnswers = {}; go("#/os-quiz"); });
  });
  content.querySelectorAll('[data-action="browser-restart"]').forEach((el) => {
    el.addEventListener("click", () => { state.browserAnswers = {}; go("#/browser-quiz"); });
  });

  content.querySelectorAll('[data-action="accept-os"]').forEach((el) => {
    el.addEventListener("click", () => {
      const id = el.dataset.os;
      state.osList = normalizeOsList([id]);
      localStorage.setItem("osList", JSON.stringify(state.osList));
      state.browserAnswers = {};
      state.pendingBrowserSelection = new Set();
      go("#/browser-choice");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  content.querySelectorAll('[data-action="accept-browser"]').forEach((el) => {
    el.addEventListener("click", () => {
      state.browserList = [el.dataset.browser];
      localStorage.setItem("browserList", JSON.stringify(state.browserList));
      history.replaceState(null, "", "#/home");
      handleRoute();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  content.querySelectorAll(".scenario-card").forEach((el) => {
    el.addEventListener("click", () => {
      go("#/scenario/" + el.dataset.scenario);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  content.querySelectorAll('[data-action="show-everything"]').forEach((el) => {
    el.addEventListener("click", () => { go("#/all"); window.scrollTo({ top: 0, behavior: "smooth" }); });
  });
  content.querySelectorAll('[data-action="home"]').forEach((el) => {
    el.addEventListener("click", () => go("#/all"));
  });
  content.querySelectorAll('[data-action="back-scenario"]').forEach((el) => {
    el.addEventListener("click", () => go("#/scenario/" + state.scenarioId));
  });
  content.querySelectorAll('[data-action="show-all"]').forEach((el) => {
    el.addEventListener("click", () => {
      /* Escape hatch: skip straight to the categories page, using
         sensible defaults if the wizard hasn't been finished yet. */
      if (!state.osList.length) {
        state.osList = ["win", "mac", "linux"];
        localStorage.setItem("osList", JSON.stringify(state.osList));
      }
      if (!state.browserList.length) {
        state.browserList = ["firefox", "google-chrome"];
        localStorage.setItem("browserList", JSON.stringify(state.browserList));
      }
      go("#/home");
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
  content.querySelectorAll('[data-item]').forEach((el) => {
    el.addEventListener("click", () => {
      go(`#/item/${state.scenarioId}/${encodeURIComponent(el.dataset.item)}`);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });
}

function bindTilt() {
  document.querySelectorAll(".scenario-card").forEach((el) => {
    let raf = null;
    el.addEventListener("mousemove", (e) => {
      const rect = el.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      const rx = (y - 0.5) * -6;
      const ry = (x - 0.5) * 6;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        el.style.transform = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-5px)`;
      });
    });
    el.addEventListener("mouseleave", () => {
      if (raf) cancelAnimationFrame(raf);
      el.style.transform = "";
    });
  });
}

/* ============================================================
   NEURAL-LINK BACKGROUND
   A free-roaming constellation. Dots drift all over the
   screen (no grid), linking up with whoever is nearby.
   The cursor doesn't capture them — it just stirs the swarm:
   nearby dots lean into its direction of travel, swirl lazily
   around it and ease out of its way, like fish around a hand.
   Clicking detonates a shockwave that scatters everything,
   after which the field settles back to a lazy cruise.
   ============================================================ */
(function initNeuralGrid() {
  const canvas = document.getElementById("dotGrid");
  if (!canvas) return;
  const ctx = canvas.getContext("2d", { alpha: true });
  let dots = [];
  let pulses = [];
  const mouse = { x: -9999, y: -9999, px: -9999, py: -9999, vx: 0, vy: 0 };
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  let t = 0;

  const LINK_DIST = 140;            // max distance for dot-to-dot links
  const LINK_DIST2 = LINK_DIST * LINK_DIST;
  const CURSOR_LINK_R = 250;        // radius for cursor-to-dot links
  const CURSOR_LINK_R2 = CURSOR_LINK_R * CURSOR_LINK_R;
  const MOUSE_R = 170;              // cursor influence radius
  const MOUSE_R2 = MOUSE_R * MOUSE_R;
  const PULSE_R = 26;               // click marker radius — small & instant (v1.2)
  const CRUISE = 0.28;              // relaxed drift speed (slowed down in 1.1)
  const MAX_SPEED = 0.75;           // hard speed cap (click needs headroom)
  const MAX_DOTS = 1000;            // spawned dots beyond this fade away

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }
  function build() {
    const count = Math.max(60, Math.min(550, Math.round((W * H) / 5000)));
    dots = [];
    for (let i = 0; i < count; i++) {
      dots.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * CRUISE * 2,
        vy: (Math.random() - 0.5) * CRUISE * 2,
        p: Math.random() * Math.PI * 2,     // steering phase
        sp: 0.3 + Math.random() * 0.5,      // steering speed
        r: 1.0 + Math.random() * 1.1,       // dot radius
        z: 0.65 + Math.random() * 0.7,      // depth: parallax speed & size
        life: 1,                            // fade in/out multiplier
        dying: false,                       // capped dots fade away
        base: true                          // field dots are permanent
      });
    }
  }

  /* Click / tap: an instant, tiny circle marker pops at the cursor AND
     a few brand-new dots burst out of the click point, fading in and
     joining the swarm (they fade away again once the field is full). */
  function spawnPulse(x, y) {
    pulses.push({ x, y, r: 0, life: 1 });
    const n = 5;
    for (let i = 0; i < n; i++) {
      if (dots.length >= MAX_DOTS) break;
      const a = Math.random() * Math.PI * 2;
      const sp = 0.6 + Math.random() * 0.9;
      dots.push({
        x: x + Math.cos(a) * 3,
        y: y + Math.sin(a) * 3,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        p: Math.random() * Math.PI * 2,
        sp: 0.3 + Math.random() * 0.5,
        r: 1.0 + Math.random() * 1.1,
        z: 0.65 + Math.random() * 0.7,
        life: 0.01,
        dying: false,
        born: t,
        base: false
      });
    }
  }

  function loop() {
    t += 0.016;
    ctx.clearRect(0, 0, W, H);
    const isLight = document.documentElement.getAttribute("data-theme") === "light";
    const baseR = isLight ? 50 : 96;
    const baseG = isLight ? 70 : 128;
    const baseB = isLight ? 190 : 252;

    /* Smoothed cursor velocity (direction of travel). */
    if (mouse.x > -1000 && mouse.px > -1000) {
      mouse.vx += ((mouse.x - mouse.px) - mouse.vx) * 0.25;
      mouse.vy += ((mouse.y - mouse.py) - mouse.vy) * 0.25;
    } else {
      mouse.vx *= 0.8;
      mouse.vy *= 0.8;
    }
    mouse.px = mouse.x;
    mouse.py = mouse.y;
    const mSpeed = Math.hypot(mouse.vx, mouse.vy);
    const mLen = mSpeed || 1;
    const flow = Math.min(1, mSpeed / 18);   // 0 when cursor rests

    /* Physics update. Spawned dots fade in; capped ones fade out and
       are removed once fully gone. */
    for (let i = dots.length - 1; i >= 0; i--) {
      const d = dots[i];
      if (d.dying) {
        d.life -= 0.035;
        if (d.life <= 0) { dots.splice(i, 1); continue; }
      } else if (d.life < 1) {
        d.life = Math.min(1, d.life + 0.04);
      }
      // Click-spawned dots are temporary: they join the swarm for a
      // few seconds, then fade away so the field keeps its balance.
      if (!d.base && !d.dying && d.born !== undefined && t - d.born > 3.5) d.dying = true;

      // Organic steering — each dot's path curves on its own.
      d.vx += Math.sin(t * d.sp + d.p) * 0.02;
      d.vy += Math.cos(t * d.sp * 0.9 + d.p * 1.7) * 0.02;

      // Cursor: no capture, just a stir. Nearby dots lean into
      // its direction of travel, swirl lazily around it and ease
      // out of its way — like fish around a hand.
      const dx = d.x - mouse.x, dy = d.y - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (mouse.x > -1000 && d2 < MOUSE_R2 && d2 > 0.01) {
        const dist = Math.sqrt(d2);
        const prox = 1 - dist / MOUSE_R;
        const push = prox * prox;            // gentle falloff at the edge
        // lean into the cursor's direction of travel
        d.vx += (mouse.vx / mLen) * push * flow * 0.30;
        d.vy += (mouse.vy / mLen) * push * flow * 0.30;
        // lazy tangential swirl around it
        d.vx += (-dy / dist) * push * 0.10;
        d.vy += (dx / dist) * push * 0.10;
        // faint clearing — drift away instead of clustering
        d.vx += (dx / dist) * push * 0.05;
        d.vy += (dy / dist) * push * 0.05;
      }

      // Homeostatic speed: bursts decay back to a lazy cruise.
      const spd2 = d.vx * d.vx + d.vy * d.vy;
      if (spd2 > MAX_SPEED * MAX_SPEED) {
        const k = MAX_SPEED / Math.sqrt(spd2);
        d.vx *= k; d.vy *= k;
      } else if (spd2 < CRUISE * CRUISE) {
        const k = Math.min(1.03, Math.sqrt((CRUISE * CRUISE) / Math.max(spd2, 1e-4)));
        d.vx *= k; d.vy *= k;
      }

      // Move. (position integration — velocity becomes displacement)
      d.x += d.vx * d.z;
      d.y += d.vy * d.z;

      // Wrap around the screen edges.
      if (d.x < -20) d.x = W + 20; else if (d.x > W + 20) d.x = -20;
      if (d.y < -20) d.y = H + 20; else if (d.y > H + 20) d.y = -20;
    }

    /* Expanding shockwave rings. */
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      p.r += 5;
      p.life *= 0.93;
      if (p.life < 0.03 || p.r > PULSE_R) { pulses.splice(i, 1); continue; }
      ctx.strokeStyle = `rgba(${baseR}, ${baseG}, ${baseB}, ${(p.life * 0.6).toFixed(3)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.stroke();
    }

    /* Constellation links — connect dots that drift close together. */
    ctx.lineWidth = 0.6;
    for (let i = 0; i < dots.length; i++) {
      const a = dots[i];
      for (let j = i + 1; j < dots.length; j++) {
        const b = dots[j];
        const dx = a.x - b.x;
        if (dx > LINK_DIST || dx < -LINK_DIST) continue;
        const dy = a.y - b.y;
        if (dy > LINK_DIST || dy < -LINK_DIST) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 > LINK_DIST2) continue;
        const alpha = (1 - Math.sqrt(d2) / LINK_DIST) * 0.25 * Math.min(a.life, b.life);
        ctx.strokeStyle = `rgba(${baseR}, ${baseG}, ${baseB}, ${alpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }

    /* Cursor links — the pointer weaves itself into the web. */
    for (const d of dots) {
      const dx = d.x - mouse.x, dy = d.y - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (mouse.x < -1000 || d2 > CURSOR_LINK_R2) continue;
      const s = 1 - Math.sqrt(d2) / CURSOR_LINK_R;
      ctx.strokeStyle = `rgba(${baseR}, ${baseG}, ${baseB}, ${(s * 0.45 * d.life).toFixed(3)})`;
      ctx.lineWidth = 0.5 + s * 1.6;
      ctx.beginPath();
      ctx.moveTo(mouse.x, mouse.y);
      ctx.lineTo(d.x, d.y);
      ctx.stroke();
    }

    /* Dots — brighter and bigger near the cursor or when moving fast. */
    for (const d of dots) {
      const dx = d.x - mouse.x, dy = d.y - mouse.y;
      const d2 = dx * dx + dy * dy;
      const s = (mouse.x > -1000 && d2 < MOUSE_R2) ? 1 - Math.sqrt(d2) / MOUSE_R : 0;
      const spd = Math.hypot(d.vx, d.vy);
      const energy = Math.min(1, Math.max(0, (spd - CRUISE) / (MAX_SPEED - CRUISE)));
      const alpha = Math.min(1, 0.22 + s * 0.4 + energy * 0.35) * d.life;
      const size = (d.r * d.z + energy * 1.2) * (0.5 + 0.5 * d.life);
      ctx.fillStyle = `rgba(${Math.round(baseR + s * 50)}, ${Math.round(baseG - s * 30)}, ${Math.round(baseB + s * 3)}, ${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(d.x, d.y, size, 0, Math.PI * 2);
      ctx.fill();
    }

    /* Cursor glow. */
    if (mouse.x > -1000 && mouse.y > -1000) {
      ctx.fillStyle = `rgba(${baseR + 40}, ${baseG - 20}, ${baseB}, 0.7)`;
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(loop);
  }
  window.addEventListener("resize", resize);
  window.addEventListener("mousemove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener("mouseleave", () => { mouse.x = -9999; mouse.y = -9999; });
  window.addEventListener("click", (e) => {
    // Every click — including on buttons and cards — seeds new dots.
    spawnPulse(e.clientX, e.clientY);
  });
  document.addEventListener("touchstart", (e) => {
    if (e.touches[0]) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
      spawnPulse(mouse.x, mouse.y);
    }
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
  }, { passive: true });
  document.addEventListener("touchend", () => { mouse.x = -9999; mouse.y = -9999; });
  resize();
  loop();
})();

/* ============================================================
   GLOBAL EVENTS
   ============================================================ */
document.getElementById("themeToggle").addEventListener("click", () => {
  state.theme = state.theme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", state.theme);
  localStorage.setItem("theme", state.theme);
});

document.getElementById("osBadge").addEventListener("click", () => {
  state.osAnswers = {};
  state.browserAnswers = {};
  state.osList = [];
  state.browserList = [];
  state.pendingOsSelection = new Set();
  state.pendingBrowserSelection = new Set();
  localStorage.removeItem("osList");
  localStorage.removeItem("browserList");
  history.replaceState(null, "", "#/os-choice");
  handleRoute();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.getElementById("browserBadge").addEventListener("click", () => {
  state.browserAnswers = {};
  state.browserList = [];
  state.pendingBrowserSelection = new Set();
  localStorage.removeItem("browserList");
  history.replaceState(null, "", "#/browser-choice");
  handleRoute();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.getElementById("siteTitle").addEventListener("click", () => {
  if (state.osList.length && state.browserList.length) go("#/home");
  else go("#/os-choice");
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  const v = e.target.value.trim();
  if (v) {
    history.replaceState(null, "", "#/search/" + encodeURIComponent(v));
    state.query = v.toLowerCase();
    state.view = "search";
    render();
  } else {
    go(lastNonSearchRoute);
  }
});

/* ============================================================
   INIT
   ============================================================ */
if (!location.hash || location.hash === "#") {
  history.replaceState(null, "", "#/welcome");
}
handleRoute();
</script>
</body>
</html>
