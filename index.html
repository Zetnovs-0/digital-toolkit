<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Digital Toolkit</title>
<style>
  /* ============ THEME ============ */
  :root{
    --bg:#0b0d12;
    --panel:#141822;
    --panel-2:#1b2130;
    --line:#252c3d;
    --text:#e9edf7;
    --muted:#8992a8;
    --accent:#5c7cfa;
    --accent-soft:rgba(92,124,250,.14);
    --ok:#34d399;
    --mac:#f472b6;
    --win:#38bdf8;
    --lin:#fbbf24;
    --radius:16px;
    --tap:110ms;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}

  body{
    background:radial-gradient(1100px 560px at 50% -12%, #16203a 0%, var(--bg) 62%) fixed;
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:30px 18px 70px;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }

  .hidden{display:none !important}

  /* ============ HEADER ============ */
  .brand{
    text-align:center;
    margin-bottom:38px;
  }
  .brand h1{
    font-size:1.55rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin:0 0 6px;
    font-weight:800;
  }
  .brand p{
    margin:0;
    color:var(--muted);
    font-size:.85rem;
  }

  /* ============ STAGES ============ */
  .stage{
    width:min(1020px,100%);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .fade-in{animation:stageIn 260ms ease both}
  @keyframes stageIn{
    from{opacity:0; transform:translateY(10px)}
    to{opacity:1; transform:translateY(0)}
  }

  /* ============ OS SELECTION ============ */
  .os-row{
    display:grid;
    grid-template-columns:1fr 1.22fr 1fr;
    gap:18px;
    align-items:center;
    width:100%;
  }

  .os-card{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:36px 18px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    color:var(--text);
    font:inherit;
    font-weight:700;
    font-size:1.02rem;
    cursor:pointer;
    transition:transform var(--tap) ease, border-color var(--tap) ease,
               background var(--tap) ease, box-shadow var(--tap) ease;
  }
  .os-card .ico{font-size:2.1rem; line-height:1}
  .os-card .sub{font-size:.72rem; color:var(--muted); font-weight:500}

  .os-card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    background:var(--panel-2);
    box-shadow:0 14px 40px rgba(0,0,0,.4);
  }
  .os-card:active{transform:scale(.965)}

  .os-card--center{
    padding:52px 18px;
    border-color:rgba(92,124,250,.5);
    background:linear-gradient(180deg,#1a2136,#141822);
    box-shadow:0 0 0 1px rgba(92,124,250,.08), 0 18px 50px rgba(0,0,0,.35);
  }
  .os-card--center .ico{font-size:2.7rem}

  /* ============ FLYING OS BADGE ============ */
  .os-flyer{
    position:fixed;
    z-index:9998;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--panel-2);
    border:1px solid var(--accent);
    border-radius:18px;
    color:var(--text);
    font-weight:700;
    font-size:22px;
    pointer-events:none;
    box-shadow:0 16px 50px rgba(0,0,0,.55);
    transition:
      transform 400ms cubic-bezier(.4,0,.2,1),
      width 400ms cubic-bezier(.4,0,.2,1),
      height 400ms cubic-bezier(.4,0,.2,1),
      border-radius 400ms cubic-bezier(.4,0,.2,1),
      font-size 400ms cubic-bezier(.4,0,.2,1);
  }

  /* ============ BROWSER STAGE ============ */
  .os-badge-row{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    margin-bottom:34px;
    min-height:46px;
  }

  .os-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:11px 22px;
    border-radius:999px;
    background:var(--panel-2);
    border:1px solid var(--accent);
    font-weight:700;
    font-size:.95rem;
    white-space:nowrap;
    box-shadow:0 8px 28px rgba(0,0,0,.35);
  }

  .link-btn{
    background:none;
    border:none;
    color:var(--muted);
    font:inherit;
    font-size:.78rem;
    cursor:pointer;
    padding:6px 8px;
    border-radius:8px;
    transition:color var(--tap) ease, background var(--tap) ease;
  }
  .link-btn:hover{color:var(--text); background:var(--panel-2)}
  .link-btn:active{transform:scale(.95)}

  .os-badge-row .link-btn{
    position:absolute;
    right:0;
    top:50%;
    transform:translateY(-50%);
  }
  .os-badge-row .link-btn:active{transform:translateY(-50%) scale(.95)}

  .browser-columns{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:16px;
    width:100%;
    align-items:start;
  }

  .browser-col{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    min-height:100%;
  }

  .browser-col--center{
    background:linear-gradient(180deg,#171d2c,#141822);
    border-color:rgba(92,124,250,.28);
  }

  .col-title{
    margin:0 0 6px;
    font-size:.72rem;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    text-align:center;
  }

  .browser-list{
    display:flex;
    flex-direction:column;
    gap:7px;
    flex:1;
  }

  .browser-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:11px 14px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:11px;
    color:var(--text);
    font:inherit;
    font-size:.88rem;
    text-align:left;
    cursor:pointer;
    transition:border-color var(--tap) ease, background var(--tap) ease,
               transform var(--tap) ease, color var(--tap) ease;
  }
  .browser-btn:hover{border-color:var(--accent); background:#202739}
  .browser-btn:active{transform:scale(.975)}

  .browser-btn.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:#fff;
    font-weight:600;
  }
  .browser-btn .tick{
    color:var(--accent);
    font-weight:800;
    font-size:.85rem;
  }

  .hidden-note{
    font-size:.68rem;
    color:var(--muted);
    text-align:center;
    padding:6px 0 2px;
    opacity:.7;
  }

  /* ============ QUIZ BUTTON ============ */
  .quiz-btn{
    margin-top:10px;
    padding:13px 14px;
    border-radius:12px;
    border:1px dashed rgba(92,124,250,.55);
    background:rgba(92,124,250,.08);
    color:#c3cdff;
    font:inherit;
    font-size:.88rem;
    font-weight:700;
    cursor:pointer;
    transition:background var(--tap) ease, transform var(--tap) ease,
               border-color var(--tap) ease;
  }
  .quiz-btn:hover{background:rgba(92,124,250,.18); border-color:var(--accent)}
  .quiz-btn:active{transform:scale(.97)}

  /* ============ PROCEED / SHOW ALL ============ */
  .proceed-btn{
    margin-top:30px;
    padding:15px 54px;
    border-radius:999px;
    border:none;
    background:var(--accent);
    color:#fff;
    font:inherit;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 12px 34px rgba(92,124,250,.32);
    transition:transform var(--tap) ease, box-shadow var(--tap) ease,
               background var(--tap) ease;
  }
  .proceed-btn:hover{background:#6b88ff; box-shadow:0 16px 44px rgba(92,124,250,.45)}
  .proceed-btn:active{transform:scale(.96)}

  .show-all-btn{
    margin-top:auto;
    padding:13px 40px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    font:inherit;
    font-size:.86rem;
    font-weight:600;
    cursor:pointer;
    transition:color var(--tap) ease, border-color var(--tap) ease,
               transform var(--tap) ease, background var(--tap) ease;
  }
  .show-all-btn:hover{color:var(--text); border-color:var(--accent); background:var(--panel)}
  .show-all-btn:active{transform:scale(.96)}

  #mainMenu{
    gap:0;
    padding-bottom:8px;
  }
  #mainMenu .show-all-btn{margin-top:56px}

  /* ============ TOOLS VIEW ============ */
  .tools-head{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    width:100%;
    margin-bottom:34px;
    min-height:46px;
  }
  .tools-head .link-btn{position:absolute; top:50%; transform:translateY(-50%)}
  .tools-head .link-btn:active{transform:translateY(-50%) scale(.95)}
  #backBtn{left:0}
  #toggleAllBtn{right:0}

  #toolsBody{width:100%; display:flex; flex-direction:column; gap:34px}

  .cat-title{
    font-size:.8rem;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 14px;
    font-weight:800;
  }

  .tool-section{margin-bottom:18px}

  .section-badge{
    display:inline-block;
    font-size:.7rem;
    font-weight:700;
    letter-spacing:.05em;
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:12px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--muted);
  }
  .section-badge.compatible{
    color:var(--ok);
    border-color:rgba(52,211,153,.35);
    background:rgba(52,211,153,.08);
  }
  .section-badge.incompatible{
    color:#a2abc4;
    border-color:var(--line);
    background:var(--panel);
  }

  .tool-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:13px;
  }

  .tool-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:15px 16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:border-color var(--tap) ease, transform var(--tap) ease,
               background var(--tap) ease;
  }
  .tool-card:hover{border-color:rgba(92,124,250,.55); transform:translateY(-2px)}
  .tool-card.is-selected{
    border-color:var(--accent);
    background:linear-gradient(180deg, rgba(92,124,250,.12), var(--panel));
  }

  .tool-head{display:flex; align-items:center; justify-content:space-between; gap:8px}
  .tool-name{font-weight:700; font-size:.95rem}
  .tool-desc{margin:0; font-size:.78rem; color:var(--muted); line-height:1.45}

  .pill--sel{
    font-size:.62rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-weight:800;
    color:var(--accent);
    border:1px solid rgba(92,124,250,.4);
    background:rgba(92,124,250,.12);
    border-radius:999px;
    padding:3px 8px;
    white-space:nowrap;
  }

  .os-tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:auto; padding-top:4px}
  .os-tag{
    font-size:.63rem;
    font-weight:700;
    padding:3px 8px;
    border-radius:6px;
    background:var(--panel-2);
    color:var(--muted);
    border-left:2px solid var(--line);
  }
  .os-tag--mac{border-left-color:var(--mac)}
  .os-tag--windows{border-left-color:var(--win)}
  .os-tag--linux{border-left-color:var(--lin)}

  /* ============ MODAL ============ */
  .modal{
    position:fixed;
    inset:0;
    background:rgba(5,7,12,.72);
    backdrop-filter:blur(4px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:10000;
    animation:stageIn 160ms ease both;
  }

  .modal-card{
    position:relative;
    width:min(520px,100%);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:30px 26px 26px;
    box-shadow:0 30px 90px rgba(0,0,0,.6);
  }

  .modal-close{
    position:absolute;
    top:12px;
    right:12px;
    width:32px;
    height:32px;
    border-radius:9px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    font:inherit;
    cursor:pointer;
    transition:color var(--tap) ease, border-color var(--tap) ease;
  }
  .modal-close:hover{color:var(--text); border-color:var(--accent)}

  .quiz-progress{
    font-size:.68rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    margin-bottom:12px;
  }
  .quiz-q{
    margin:0 0 20px;
    font-size:1.12rem;
    line-height:1.4;
  }
  .quiz-answers{display:flex; flex-direction:column; gap:9px}

  .quiz-answer{
    padding:13px 16px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    font:inherit;
    font-size:.88rem;
    text-align:left;
    cursor:pointer;
    transition:border-color var(--tap) ease, background var(--tap) ease,
               transform var(--tap) ease;
  }
  .quiz-answer:hover{border-color:var(--accent); background:#202739}
  .quiz-answer:active{transform:scale(.98)}

  .quiz-result h3{margin:0 0 8px; font-size:1.3rem}
  .quiz-result p{margin:0 0 22px; color:var(--muted); font-size:.88rem; line-height:1.5}
  .quiz-result .proceed-btn{margin-top:0; padding:13px 34px; font-size:.92rem}

  /* ============ INSTANT CLICK CIRCLE ============ */
  .click-circle{
    position:fixed;
    width:22px;
    height:22px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(92,124,250,.6), rgba(92,124,250,.16));
    transform:translate(-50%,-50%) scale(.2);
    pointer-events:none;
    z-index:99999;
    animation:instantCircle 110ms ease-out forwards;
  }
  @keyframes instantCircle{
    0%  {transform:translate(-50%,-50%) scale(.2); opacity:1}
    70% {opacity:.85}
    100%{transform:translate(-50%,-50%) scale(1.6); opacity:0}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; transition-duration:.01ms !important}
    .click-circle{display:none}
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width:760px){
    .os-row{grid-template-columns:1fr; gap:12px}
    .os-card, .os-card--center{padding:26px 16px}
    .os-card--center{order:-1}
    .browser-columns{grid-template-columns:1fr}
    .os-badge-row .link-btn{
      position:static;
      transform:none;
      margin-left:10px;
    }
    .os-badge-row .link-btn:active{transform:scale(.95)}
    .tools-head{flex-direction:column; gap:10px}
    .tools-head .link-btn{position:static; transform:none}
    .tools-head .link-btn:active{transform:scale(.95)}
    .proceed-btn{width:100%; padding:15px 0}
    .show-all-btn{width:100%}
  }
</style>
</head>
<body>

  <header class="brand">
    <h1>Digital Toolkit</h1>
    <p>Pick your system, pick your tools.</p>
  </header>

  <!-- ================= MAIN MENU ================= -->
  <main id="mainMenu" class="stage">

    <!-- STEP 1: OS SELECTION -->
    <section id="osStage" class="stage">
      <div class="os-row">
        <button class="os-card" data-os="mac">
          <span class="ico">🍎</span>
          <span>Mac OS</span>
          <span class="sub">macOS &amp; above</span>
        </button>

        <button class="os-card os-card--center" data-os="windows">
          <span class="ico">🪟</span>
          <span>Windows</span>
          <span class="sub">10 / 11</span>
        </button>

        <button class="os-card" data-os="linux">
          <span class="ico">🐧</span>
          <span>Linux</span>
          <span class="sub">any distribution</span>
        </button>
      </div>
    </section>

    <!-- STEP 2: BROWSER SELECTION -->
    <section id="browserStage" class="stage hidden">
      <div class="os-badge-row">
        <div id="selectedOsBadge" class="os-badge">🪟 Windows</div>
        <button id="changeOsBtn" class="link-btn">change</button>
      </div>

      <div class="browser-columns">
        <!-- Firefox-based -->
        <div class="browser-col">
          <h3 class="col-title">Firefox-based</h3>
          <div class="browser-list" data-engine="firefox"></div>
        </div>

        <!-- Others + Quiz -->
        <div class="browser-col browser-col--center">
          <h3 class="col-title">Others</h3>
          <div class="browser-list" data-engine="other"></div>
          <button id="takeQuizBtn" class="quiz-btn">✨ Take the quiz</button>
        </div>

        <!-- Chromium-based -->
        <div class="browser-col">
          <h3 class="col-title">Chromium-based</h3>
          <div class="browser-list" data-engine="chromium"></div>
        </div>
      </div>

      <button id="proceedBtn" class="proceed-btn">Proceed →</button>
    </section>

    <!-- ALWAYS VISIBLE -->
    <button id="showAllBtn" class="show-all-btn">Show all tools</button>
  </main>

  <!-- ================= TOOLS VIEW ================= -->
  <section id="toolsView" class="stage hidden">
    <div class="tools-head">
      <button id="backBtn" class="link-btn">← Back</button>
      <div id="toolsBadge" class="os-badge">🪟 Windows</div>
      <button id="toggleAllBtn" class="link-btn">Show all tools</button>
    </div>
    <div id="toolsBody"></div>
  </section>

  <!-- ================= QUIZ MODAL ================= -->
  <div id="quizModal" class="modal hidden">
    <div class="modal-card">
      <button id="quizClose" class="modal-close" aria-label="Close">✕</button>
      <div id="quizContent"></div>
    </div>
  </div>

  }
];

const QUIZ = [
  {
    q:'How much do you want ads and trackers blocked out of the box?',
    a:[
      { t:'A lot — privacy first',        v:'firefox'  },
      { t:'Some protection is nice',      v:'other'    },
      { t:'I install extensions for that',v:'chromium' }
    ]
  },
  {
    q:'How important are Chrome Web Store extensions to you?',
    a:[
      { t:'Essential',              v:'chromium' },
      { t:'Nice to have',           v:'other'    },
      { t:'I barely use extensions',v:'firefox'  }
    ]
  },
  {
    q:'How do you feel about telemetry and data collection?',
    a:[
      { t:'I actively avoid it', v:'firefox'  },
      { t:'Neutral',             v:'other'    },
      { t:'I don\u2019t mind',   v:'chromium' }
    ]
  }
];

const QUIZ_RESULT = { firefox:'Firefox', other:'Brave', chromium:'Chromium' };

/* =========================================================
   STATE
   ========================================================= */
const state = {
  os: null,
  browsers: new Set(),
  showAll: false,
  quizIndex: 0,
  quizScore: { firefox:0, other:0, chromium:0 }
};

const STORE_KEY = 'dt.state.v2';

function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      os: state.os,
      browsers: [...state.browsers]
    }));
  }catch(e){ /* storage disabled — ignore */ }
}

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(data.os && OS_META[data.os]) state.os = data.os;
    if(Array.isArray(data.browsers)) state.browsers = new Set(data.browsers);
  }catch(e){ /* ignore corrupt state */ }
}

/* =========================================================
   INSTANT CLICK CIRCLE
   ========================================================= */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

document.addEventListener('pointerdown', (e) => {
  if(reduceMotion) return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;

  const circle = document.createElement('span');
  circle.className = 'click-circle';
  circle.style.left = e.clientX + 'px';
  circle.style.top  = e.clientY + 'px';
  document.body.appendChild(circle);
  setTimeout(() => circle.remove(), 130);
}, { passive:true });

/* =========================================================
   HELPERS
   ========================================================= */
const $ = (sel) => document.querySelector(sel);

function osBadgeText(os){
  const m = OS_META[os];
  return m ? `${m.icon} ${m.label}` : '🌐 All systems';
}

/* =========================================================
   STEP 1 — OS SELECTION
   ========================================================= */
document.querySelectorAll('.os-card').forEach(card => {
  card.addEventListener('click', () => chooseOS(card));
});

function chooseOS(card){
  const os = card.dataset.os;
  if(!OS_META[os]) return;

  state.os = os;

  // Drop any previously selected browser that isn't available on this OS
  [...state.browsers].forEach(name => {
    const b = BROWSERS.find(x => x.name === name);
    if(b && !b.os.includes(os)) state.browsers.delete(name);
  });
  save();

  const label = osBadgeText(os);
  const badge = $('#selectedOsBadge');
  const browserStage = $('#browserStage');
  const osStage = $('#osStage');

  // --- set badge content BEFORE measuring
  badge.textContent = label;

  // --- measure the target position (render invisibly, then restore)
  browserStage.classList.remove('hidden');
  browserStage.style.visibility = 'hidden';

  const startRect = card.getBoundingClientRect();
  const endRect   = badge.getBoundingClientRect();

  browserStage.style.visibility = '';
  browserStage.classList.add('hidden');

  // --- create the flying clone
  const flyer = document.createElement('div');
  flyer.className = 'os-flyer';
  flyer.textContent = label;
  flyer.style.left   = startRect.left   + 'px';
  flyer.style.top    = startRect.top    + 'px';
  flyer.style.width  = startRect.width  + 'px';
  flyer.style.height = startRect.height + 'px';
  document.body.appendChild(flyer);

  // --- animate to the badge position
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      flyer.style.transform    = `translate(${endRect.left - startRect.left}px, ${endRect.top - startRect.top}px)`;
      flyer.style.width        = endRect.width  + 'px';
      flyer.style.height       = endRect.height + 'px';
      flyer.style.borderRadius = '999px';
      flyer.style.fontSize     = '15px';
    });
  });

  // --- swap stages once it lands
  setTimeout(() => {
    flyer.remove();
    osStage.classList.add('hidden');

    browserStage.classList.remove('hidden');
    browserStage.classList.remove('fade-in');
    void browserStage.offsetWidth;   // force reflow so the animation replays
    browserStage.classList.add('fade-in');

    renderBrowsers();
  }, 420);
}

// Change system → back to OS selection
$('#changeOsBtn').addEventListener('click', () => {
  $('#browserStage').classList.add('hidden');
  $('#osStage').classList.remove('hidden');
  $('#osStage').classList.remove('fade-in');
  void $('#osStage').offsetWidth;
  $('#osStage').classList.add('fade-in');
});

/* =========================================================
   STEP 2 — BROWSER SELECTION
   ========================================================= */
function renderBrowsers(){
  ['firefox','other','chromium'].forEach(engine => {
    const list = document.querySelector(`.browser-list[data-engine="${engine}"]`);
    if(!list) return;
    list.innerHTML = '';

    const available = BROWSERS.filter(b =>
      b.engine === engine && (!state.os || b.os.includes(state.os))
    );
    const hiddenCount = BROWSERS.filter(b =>
      b.engine === engine && state.os && !b.os.includes(state.os)
    ).length;

    available.forEach(b => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'browser-btn' + (state.browsers.has(b.name) ? ' selected' : '');
      btn.dataset.name = b.name;
      btn.innerHTML = `<span>${b.name}</span>` +
                      (state.browsers.has(b.name) ? '<span class="tick">✓</span>' : '');
      btn.addEventListener('click', () => toggleBrowser(b.name, btn));
      list.appendChild(btn);
    });

    if(hiddenCount > 0){
      const note = document.createElement('div');
      note.className = 'hidden-note';
      note.textContent = `${hiddenCount} not available on ${OS_META[state.os].label}`;
      list.appendChild(note);
    }
  });

  updateProceed();
}

function toggleBrowser(name, btn){
  const isOn = state.browsers.has(name);
  if(isOn) state.browsers.delete(name);
  else     state.browsers.add(name);
  save();

  const nowOn = !isOn;
  btn.classList.toggle('selected', nowOn);

  const existingTick = btn.querySelector('.tick');
  if(nowOn && !existingTick){
    const tick = document.createElement('span');
    tick.className = 'tick';
    tick.textContent = '✓';
    btn.appendChild(tick);
  }else if(!nowOn && existingTick){
    existingTick.remove();
  }

  updateProceed();
}

function updateProceed(){
  const n = state.browsers.size;
  $('#proceedBtn').textContent = n > 0 ? `Proceed with ${n} →` : 'Proceed →';
}

/* =========================================================
   PROCEED / SHOW ALL
   ========================================================= */
$('#proceedBtn').addEventListener('click', () => showTools(false));
$('#showAllBtn').addEventListener('click', () => showTools(true));

function showTools(showAll){
  state.showAll = showAll;

  $('#mainMenu').classList.add('hidden');
  const view = $('#toolsView');
  view.classList.remove('hidden');

  $('#toolsBadge').textContent = showAll ? '🌐 All systems' : osBadgeText(state.os);
  $('#toggleAllBtn').textContent = showAll ? 'Only my system' : 'Show all tools';

  renderTools();
  window.scrollTo({ top:0, behavior:'instant' in window ? 'instant' : 'auto' });
}

$('#backBtn').addEventListener('click', () => {
  $('#toolsView').classList.add('hidden');
  $('#mainMenu').classList.remove('hidden');
  window.scrollTo({ top:0 });
});

$('#toggleAllBtn').addEventListener('click', () => {
  state.showAll = !state.showAll;
  $('#toolsBadge').textContent = state.showAll ? '🌐 All systems' : osBadgeText(state.os);
  $('#toggleAllBtn').textContent = state.showAll ? 'Only my system' : 'Show all tools';
  renderTools();
});

/* =========================================================
   TOOLS VIEW RENDERING
   ========================================================= */
function renderTools(){
  const body = $('#toolsBody');
  body.innerHTML = '';

  const os = state.showAll ? null : state.os;

  TOOL_CATEGORIES.forEach(cat => {
    const section = document.createElement('section');
    section.className = 'category';

    const title = document.createElement('h2');
    title.className = 'cat-title';
    title.textContent = cat.name;
    section.appendChild(title);

    if(!os){
      // No OS filter → single grid, every card carries OS tags
      const grid = document.createElement('div');
      grid.className = 'tool-grid';
      cat.items.forEach(t => grid.appendChild(toolCard(t)));
      section.appendChild(grid);
    }else{
      const compatible   = cat.items.filter(t =>  t.os.includes(os));
      const incompatible = cat.items.filter(t => !t.os.includes(os));

      if(compatible.length){
        section.appendChild(buildSection(
          '✅ Available for your system', 'compatible', compatible
        ));
      }
      if(incompatible.length){
        section.appendChild(buildSection(
          '🔒 For other systems', 'incompatible', incompatible
        ));
      }
    }

    body.appendChild(section);
  });
}

function buildSection(label, variant, items){
  const wrap = document.createElement('div');
  wrap.className = 'tool-section ' + variant;

  const badge = document.createElement('div');
  badge.className = 'section-badge ' + variant;
  badge.textContent = label;
  wrap.appendChild(badge);

  const grid = document.createElement('div');
  grid.className = 'tool-grid';
  items.forEach(t => grid.appendChild(toolCard(t)));
  wrap.appendChild(grid);

  return wrap;
}

function toolCard(tool){
  const el = document.createElement('article');
  el.className = 'tool-card';

  const isSelected = state.browsers.has(tool.name);
  if(isSelected) el.classList.add('is-selected');

  const tags = tool.os
    .map(o => `<span class="os-tag os-tag--${o}">${OS_LABEL[o]}</span>`)
    .join('');

  el.innerHTML = `
    <div class="tool-head">
      <span class="tool-name">${tool.name}</span>
      ${isSelected ? '<span class="pill--sel">selected</span>' : ''}
    </div>
    <p class="tool-desc">${tool.desc}</p>
    <div class="os-tags">${tags}</div>
  `;

  return el;
}

/* =========================================================
   QUIZ
   ========================================================= */
$('#takeQuizBtn').addEventListener('click', openQuiz);
$('#quizClose').addEventListener('click', closeQuiz);
$('#quizModal').addEventListener('click', (e) => {
  if(e.target === $('#quizModal')) closeQuiz();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape') closeQuiz();
});

function openQuiz(){
  state.quizIndex = 0;
  state.quizScore = { firefox:0, other:0, chromium:0 };
  $('#quizModal').classList.remove('hidden');
  renderQuizQuestion();
}

function closeQuiz(){
  $('#quizModal').classList.add('hidden');
}

function renderQuizQuestion(){
  const content = $('#quizContent');
  const i = state.quizIndex;

  if(i >= QUIZ.length){
    renderQuizResult();
    return;
  }

  const item = QUIZ[i];
  content.innerHTML = `
    <div class="quiz-progress">Question ${i + 1} of ${QUIZ.length}</div>
    <h3 class="quiz-q">${item.q}</h3>
    <div class="quiz-answers"></div>
  `;

  const answers = content.querySelector('.quiz-answers');
  item.a.forEach(ans => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'quiz-answer';
    btn.textContent = ans.t;
    btn.addEventListener('click', () => {
      state.quizScore[ans.v]++;
      state.quizIndex++;
      renderQuizQuestion();
    });
    answers.appendChild(btn);
  });
}

function renderQuizResult(){
  const s = state.quizScore;
  let winner = 'other';
  if(s.firefox  >= s.other && s.firefox  >= s.chromium) winner = 'firefox';
  else if(s.chromium >= s.other && s.chromium >= s.firefox) winner = 'chromium';

  const recommended = pickAvailable(QUIZ_RESULT[winner]);

  $('#quizContent').innerHTML = `
    <div class="quiz-result">
      <h3>🎯 ${recommended}</h3>
      <p>Based on your answers, <strong>${recommended}</strong> looks like the best fit
         for ${state.os ? OS_META[state.os].label : 'your system'}.</p>
      <button id="quizAccept" class="proceed-btn">Select ${recommended}</button>
    </div>
  `;

  $('#quizAccept').addEventListener('click', () => {
    selectBrowserByName(recommended);
    closeQuiz();
  });
}

/* Return the requested browser, or the closest available one for the chosen OS */
function pickAvailable(name){
  const target = BROWSERS.find(b => b.name === name);
  if(!target) return name;
  if(!state.os || target.os.includes(state.os)) return target.name;

  const fallback = BROWSERS.find(b =>
    b.engine === target.engine && b.os.includes(state.os)
  );
  return fallback ? fallback.name : target.name;
}

function selectBrowserByName(name){
  const finalName = pickAvailable(name);
  state.browsers.add(finalName);
  save();
  renderBrowsers();
}

/* =========================================================
   BOOT
   ========================================================= */
load();
updateProceed();
</script>
</body>
</html>
